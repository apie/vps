---
- name: config telegram_members
  hosts: all
  roles:
    - role: app_user
      vars:
        username: telegram_members
        repo_name: telegram_members
        app_cron_mailto: "{{ cron_mailto }}"
        app_vault_file: "{{ playbook_dir }}/../../vault/{{ username }}.yml"
        app_config_files: "{{ [telegram_send_config] }}"
  tasks:
    - name: Tasks as user
      become: true
      become_user: telegram_members
      block:
        - name: Install requirements locally
          ansible.builtin.pip:
            executable: pip3.10
            requirements: /home/telegram_members/src/setup/requirements.txt
        - name: Install telegram-send
          ansible.builtin.pip:
            name: telegram-send
        - name: Setup cronjob
          ansible.builtin.cron:
            name: "Send alert for change in number of members of telegram channel {{ item }}"
            minute: "59"
            hour: "7"
            job: "/usr/bin/python3.10 /home/telegram_members/src/telegram_members.py {{ item }} && /usr/bin/python3.10 /home/telegram_members/src/graph.py {{ item }} && /home/telegram_members/.local/bin/telegram-send --config /home/telegram_members/src/telegram-send.conf --image /home/telegram_members/src/{{ item }}.png"
          with_items:
            - dagelijksdirkjan
            - LidlDagDeals
