---
- name: config mastermind
  hosts: all
  roles:
    - role: app_service
      vars:
        username: mastermind
        repo_name: mastermindbot
        service_description: "Mastermind bot"
        script_filename: bot.py
        service_template: pythonvenvservice.service.j2
        app_venv_python: python3.10
        app_requirements: setup/requirements.txt
        app_vault_file: "{{ playbook_dir }}/../../vault/{{ username }}.yml"
        app_config_files: "{{ configs }}"
  vars:
    username: mastermind
    gunicorn_service_description: "Mastermind web"
    gunicorn_service_working_directory: "/home/mastermind/src/web/"
    gunicorn_service_script_filename: "start.bash"
    gunicorn_service_reload_command: "/usr/bin/pkill -HUP -f 'mastermind/src/web/venv/bin/gunicorn'"
  tasks:
    - name: Install web requirements in venv
      become: true
      become_user: mastermind
      ansible.builtin.pip:
        virtualenv: /home/mastermind/src/web/venv
        virtualenv_python: python3.10
        requirements: /home/mastermind/src/web/setup/requirements.txt
    - name: Copy web service file
      become: true
      ansible.builtin.template:
        src: gunicornservice.service.j2
        dest: /etc/systemd/system/mastermind-web.service
        mode: "0644"
      notify: reload systemctl
    - name: Run pending handlers so systemd knows the unit
      ansible.builtin.meta: flush_handlers
    - name: Enable web service + start
      become: true
      ansible.builtin.systemd_service:
        name: mastermind-web.service
        state: started
        enabled: true

