---
- name: config d87.nl
  hosts: vps3
  vars:
    username: d87nl
    local_static_path: "../../static_content/d87nl"  # a symlink to the repo
    vhost_static_path: "{{ nginx_docroot }}/d87nl"
  roles:
    - role: static_vhost
      vars:
        vhostname: d87.nl
        vhost_aliases:
          - www.d87.nl
        vhost_canonical: d87.nl
  tasks:
    - name: Copy static content
      become: true
      become_user: "{{ username }}"
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/{{ local_static_path }}/"
        dest: "{{ vhost_static_path }}/"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--chmod=D0755,F0644"
