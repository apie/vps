---
- name: config nosfeed
  hosts: all
  roles:
    - role: app_user
      vars:
        username: nosfeed
        repo_name: nosfeed
        app_cron_mailto: "{{ cron_mailto }}"
        app_vault_file: "{{ playbook_dir }}/../../vault/{{ username }}.yml"
        app_config_files: "{{ [config_file] }}"  # FIXME? What config?? feeds.csv
        app_config_mode: "0644"
  tasks:
    - name: Tasks as user
      become: true
      become_user: nosfeed
      block:
        - name: Install requirements locally
          ansible.builtin.pip:
            executable: pip3.10
            requirements: /home/nosfeed/src/generate_combined_feed/requirements.in
        - name: Setup cronjob
          ansible.builtin.cron:
            name: "Generate rss for news feed"
            minute: "3,30"
            hour: "*"
            job: "/usr/bin/python3.10 /home/nosfeed/src/generate_combined_feed/generate_rss_for_feeds.py"

