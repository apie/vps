---
- name: config albumscrobbles
  hosts: vps3
  vars:
    username: albumscrobbles
    service_port: 5003
  roles:
    - role: app_service
      vars:
        repo_name: albumscrobbles
        service_description: "albumscrobbles"
        service_script_filename: "start.bash"
        use_uv: true
        app_vault_file: "{{ playbook_dir }}/../../vault/{{ username }}.yml"
        app_config_files: "{{ configs }}"
    - role: app_vhost
      vars:
        vhostname: albumscrobbles.com
        vhost_aliases:
          - www.albumscrobbles.com
        vhost_canonical: albumscrobbles.com
        vhostport: "{{ service_port }}"
  tasks:
    - name: Tasks as user
      become: true
      become_user: "{{ username }}"
      block:
        - name: Setup crontab MAILTO
          become: true
          become_user: "{{ username }}"
          vars:
            app_cron_mailto: "{{ cron_mailto }}"
          ansible.builtin.cron:
            name: MAILTO
            env: true
            job: "{{ app_cron_mailto }}"
          when: app_cron_mailto | length > 0
        - name: Setup cronjob for album size corrections
          ansible.builtin.cron:
            name: "Apply album size corrections"
            minute: "58"
            hour: "*/4"
            job: "{{ app_src_dir }}.venv/bin/python /home/{{ username }}/src/apply_corrections.py"
        - name: Setup cronjob for weekly mails
          ansible.builtin.cron:
            name: "Send weekly mails"
            minute: "59"
            hour: "6"
            dow: "tue"
            job: "{{ app_src_dir }}.venv/bin/python /home/{{ username }}/src/send_mails.py weekly"
        - name: Setup cronjob for monthly mails
          ansible.builtin.cron:
            name: "Send monthly mails"
            minute: "59"
            hour: "6"
            dom: "2"
            job: "{{ app_src_dir }}.venv/bin/python /home/{{ username }}/src/send_mails.py monthly"
        - name: Setup cronjob for yearly mails
          ansible.builtin.cron:
            name: "Send yearly mails"
            minute: "59"
            hour: "6"
            dom: "2"
            month: "1"
            job: "{{ app_src_dir }}.venv/bin/python /home/{{ username }}/src/send_mails.py yearly"
        - name: Update footer version after deploy
          ansible.builtin.shell: |
            hash=$(git show -s --format=%H)
            d=$(git show -s --format=%ci)
            s=$(git show -s --format=%s)
            echo "Version: <a href='https://github.com/apie/albumscrobbles/commit/${hash}' title='${s}'>${d}</a>" > templates/footer.txt
          args:
            chdir: "{{ app_src_dir }}"
            executable: /bin/bash
          changed_when: true
    - name: Restart service since footer changed
      become: true
      ansible.builtin.systemd_service:
        name: albumscrobbles.service
        state: restarted

