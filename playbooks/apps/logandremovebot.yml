---
- name: config logandremovebot
  hosts: all
  roles:
    - role: app_service
      vars:
        username: logandremovebot
        repo_name: logandremovebot
        service_description: "Log and remove bot"
        script_filename: log_and_remove.py
        service_template: pythonvenvservice.service.j2
        app_venv_python: python3.10
        app_requirements: setup/requirements.txt
        app_vault_file: "{{ playbook_dir }}/../../vault/{{ username }}.yml"
        app_config_files: "{{ configs }}"
