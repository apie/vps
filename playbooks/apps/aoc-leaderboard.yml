---
- name: config aoc_leaderboard
  hosts: vps3
  roles:
    - role: app_service
      vars:
        username: aoc_leaderboard
        repo_name: aoc_leaderboard
        app_requirements: ""
        use_uv: true
        service_description: "aoc_leaderboard"
        service_script_filename: "start.bash"
        nginx_locations_template: "{{ playbook_dir }}/templates/aoc_leaderboard.locations.j2"
        app_vault_file: "{{ playbook_dir }}/../../vault/{{ username }}.yml"
        app_config_files: "{{ configs }}"
