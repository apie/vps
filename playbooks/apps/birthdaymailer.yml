---
- name: config birthdaymailer
  hosts: all
  roles:
    - role: app_user
      vars:
        username: birthdaymailer
        repo_name: birthdaymailer
        app_cron_mailto: "{{ cron_mailto }}"
        app_vault_file: "{{ playbook_dir }}/../../vault/{{ username }}.yml"
        app_config_files: "{{ [settings_file] }}"
        app_config_dir: mailer
  tasks:
    - name: Setup cronjob
      become: true
      become_user: birthdaymailer
      ansible.builtin.cron:
        name: "Send email to people that celebrate their birthday today"
        minute: "40"
        hour: "7"
        job: "/usr/bin/python3.10 /home/birthdaymailer/src/mailer/birthdaymailer.py"
