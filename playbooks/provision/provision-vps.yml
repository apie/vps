---
- name: provision vps
  hosts: all
  become: true
  handlers:
    - name: Import tasks
      import_tasks: "handlers/main.yml"
  tasks:
  # VPS with minimum Ubuntu 22.04 assumed
  # Manual changes assumed:
  # ansible_user configured, host key login + sudo nopassword
  # Password for ansible_user was changed
  # Dns + reverse dns was configured to point to this host
  # Exim4 installed + configured + dns was configured to allow sending mail by this domain
  # Note exim4 config:
  #  dpkg-reconfigure exim4-config
  #  smarthost (no local mail)
  #  mail name: stad.gr
  #  listen for: 127.0.0.1 ; ::1
  #  smarthost: vps.transip.email::587
  # Also add /etc/exim4/passwd.client file
  - name: Set a hostname
    ansible.builtin.hostname:
      name: "{{ hostname }}"
  - name: Install packages
    package:
      name:
        - unattended-upgrades
        - python3-pip
        - python3-virtualenv
        - acl  # needed for ansible to perform updates as unprivileged users
        - nginx
      state: present
    when: ansible_os_family == 'Debian'
  - name: Set timezone
    community.general.timezone:
      name: Europe/Amsterdam
  - name: Set login banner
    ansible.builtin.copy:
      src: "files/banner-{{ hostname }}.txt"
      dest: /etc/motd
  - name: Dynamic login banner listing the server accounts
    ansible.builtin.copy:
      src: "files/99-list-homes"
      dest: /etc/update-motd.d/99-list-homes
      mode: 0755
  - name: Get github.com key
    shell: 'ssh-keyscan -H github.com'
    register: github_key
  - name: Add github.com to known_hosts
    lineinfile:
      dest: /etc/ssh/ssh_known_hosts
      line: "{{ github_key.stdout }}"
      create: true
  - name: Hide nginx server version in responses (enable disabled option 'server_tokens off;')
    shell: sed -i 's/server_tokens build;/server_tokens off;/' /etc/nginx/nginx.conf
    notify:
      - reload nginx
