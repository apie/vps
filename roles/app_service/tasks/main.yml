---
- name: Check if command 'uv' is available
  become: true
  become_user: "{{ username }}"
  ansible.builtin.shell: command -v uv
  environment:
    PATH: "/home/{{ username }}/.local/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  register: uv_check
  changed_when: false
  failed_when: false
  when: use_uv
- name: Install 'uv'
  become: true
  become_user: "{{ username }}"
  ansible.builtin.shell: "curl -LsSf https://astral.sh/uv/install.sh | sh"
  when: use_uv and uv_check.rc != 0
