[defaults]
roles_path = ./roles
#inventory = inventory.yml

[ssh_connection]
control_path = %(directory)s/%%h-%%p-%%r
# Reuse one SSH connection per host and keep it open for 60s after the last task
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# Run modules over the existing SSH session instead of copying files first (requires no requiretty in sudoers)
pipelining = True

