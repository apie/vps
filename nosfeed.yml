---
- name: config nosfeed
  hosts: all
  vars:
    username: nosfeed
    repo_name: nosfeed
  tasks:
  - name: Add user {{ username }}
    become: true
    ansible.builtin.user:
      name: "{{ username }}"
      shell: /bin/bash
  - name: Tasks as user
    become: true
    become_user: "{{ username }}"
    block:
      - name: Checkout source
        ansible.builtin.git:
          repo: "https://github.com/apie/{{ repo_name }}.git"
          dest: "/home/{{ username }}/src"
      - name: Install requirements locally
        ansible.builtin.pip:
          executable: pip3.10
          requirements: "/home/{{ username }}/src/generate_combined_feed/requirements.in"
      - name: Setup crontab
        ansible.builtin.cron:
          name: MAILTO
          env: yes
          job: "{{ cron_mailto }}"
      - name: Setup cronjob
        ansible.builtin.cron:
          name: "Generate rss for news feed"
          minute: "3,30"
          hour: "*"
          job: "/usr/bin/python3.10 /home/{{ username }}/src/generate_combined_feed/generate_rss_for_feeds.py"
  - name: Load config file from vault # FIXME? What config?? feeds.csv
    include_vars: vault/{{ username }}.yml
  - name: Copy config file from vault
    no_log: true
    become: true
    ansible.builtin.copy:
      content: "{{ config_file.content }}"
      dest: "/home/{{ username }}/src/{{ config_file.filename }}"
      owner: "{{ username }}"
      group: "{{ username }}"

